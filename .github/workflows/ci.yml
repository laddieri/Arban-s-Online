name: CI

on:
  push:
    branches: [claude/master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test

      # The e2e suite runs against this build: locally generated page images
      # served on :8080, no Supabase configured (exercises anonymous mode)
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_IMAGE_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_IMAGE_FORMAT: png
          NEXT_PUBLIC_TEST_BOOK: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  # The fresh-project bootstrap must build the same database as schema.sql
  # plus the numbered migrations (see scripts/check-schema-drift.sh)
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Check schema drift
        run: ./scripts/check-schema-drift.sh
