name: CI

on:
  push:
    branches: [claude/master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # The e2e suite runs against this build: locally generated page images
      # served on :8080, no Supabase configured (exercises anonymous mode)
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_IMAGE_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_IMAGE_FORMAT: png
          NEXT_PUBLIC_TEST_BOOK: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
